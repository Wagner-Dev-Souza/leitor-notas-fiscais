name: Painel do squad (Linear)

# Mantem `docs/linear/painel.md` atualizado a partir do quadro do Linear.
#
# Por que existe: o Linear nao tem link publico de quadro -- quem nao e membro do
# workspace nao ve nada. O arquivo gerado por este workflow e a versao que qualquer
# pessoa consegue ler no repositorio, e ela acompanha a evolucao do projeto.
#
# A chave fica em `secrets.LINEAR_API_KEY` (criptografada, nunca aparece no codigo).
# Workflows deste repositorio nao expoem secrets a pull request de fork: o evento
# `push` e `schedule` rodam apenas no repositorio de origem.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: painel-linear
  cancel-in-progress: true

jobs:
  painel:
    name: Gerar e commitar o painel
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A chave e passada por variavel de ambiente (nunca interpolada dentro do comando, o
    # que poderia aparecer no log). Sem ela o ciclo pula em vez de falhar: o agendamento
    # roda a cada 6h e nao faz sentido pintar o repositorio de vermelho por uma chave que
    # ainda nao foi configurada.
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      LINEAR_TIMEKEY: PROJ

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CPython 3.12 (mesma versao do .venv do projeto)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Conferir se a chave do Linear esta configurada
        id: chave
        run: |
          if [ -z "${LINEAR_API_KEY}" ]; then
            echo "configurada=false" >> "$GITHUB_OUTPUT"
            echo "LINEAR_API_KEY nao esta configurada: pulando a atualizacao do painel."
            echo "Para ativar: Settings > Secrets and variables > Actions > New repository secret."
          else
            echo "configurada=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerar o painel a partir do quadro
        if: steps.chave.outputs.configurada == 'true'
        run: python tools/painel_linear.py

      - name: Commitar quando o quadro mudou
        if: steps.chave.outputs.configurada == 'true'
        run: |
          # O arquivo carrega o horario do retrato, que muda a cada execucao. Comparar
          # sem essa linha evita um commit a cada 6h so com o horario trocado: o que
          # interessa versionar e a mudanca no quadro, nao o relogio.
          if git diff -I "Retrato do quadro em" --quiet -- docs/linear/painel.md; then
            echo "o quadro nao mudou desde a ultima atualizacao (so o horario do retrato)"
            git checkout -- docs/linear/painel.md
            exit 0
          fi
          git config user.name "Wagner Silva Souza"
          git config user.email "115811946+Wagner-Dev-Souza@users.noreply.github.com"
          git add docs/linear/painel.md
          git commit -m "docs: atualiza o painel do squad a partir do quadro do Linear"
          git push
