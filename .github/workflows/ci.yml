name: CI - testes e pipeline

# Roda a suite completa, a prova de idempotencia e o comando unico da entrega
# a cada push nas branches do modelo (squad-pecados -> homolog -> main).
#
# Por que windows-latest: a suite exige o interpretador no layout do projeto
# (.venv/Scripts/python.exe) - ver tests/conftest.py, fixture python_venv.
# O alvo do produto e processo local Windows, entao o CI espelha o ambiente real.

on:
  push:
    branches: [main, homolog, squad-pecados]
  pull_request:
    branches: [main, homolog]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: pytest + idempotencia + comando unico
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CPython 3.12 (mesma versao do .venv do projeto)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Criar o .venv no layout exigido pela suite (.venv/Scripts/python.exe)
        run: python -m venv .venv

      - name: Instalar as dependencias fixadas
        run: .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r requirements.txt

      - name: Instalar o Tesseract (OCR real) com o idioma portugues
        # Mesmo pacote validado na maquina de desenvolvimento (Tesseract 5.5.3, idioma
        # `por`). Sem o binario, os testes de leitura de imagem sao pulados e o caminho de
        # OCR real nao e exercitado no CI.
        shell: pwsh
        run: |
          winget install --id tesseract-ocr.tesseract -e --accept-package-agreements --accept-source-agreements --disable-interactivity

          # O instalador oficial do Windows traz so eng+osd: o pacote de portugues vem a
          # parte, senao o OCR real do runner nao serve para uma nota em portugues.
          $tessdata = "C:\Program Files\Tesseract-OCR\tessdata"
          New-Item -ItemType Directory -Force -Path $tessdata | Out-Null

          # `curl` com retry: o download vem do GitHub e um 504 de la NAO pode reprovar a
          # entrega (aconteceu de verdade no run #23 - Gateway timeout 504 no download).
          curl.exe -L --fail --retry 5 --retry-delay 3 --retry-all-errors `
            -o "$tessdata\por.traineddata" `
            "https://github.com/tesseract-ocr/tessdata_fast/raw/main/por.traineddata"
          if ($LASTEXITCODE -ne 0) { throw "falha ao baixar o por.traineddata (curl exit $LASTEXITCODE)" }

          $arquivo = Get-Item "$tessdata\por.traineddata"
          if ($arquivo.Length -lt 100000) { throw "por.traineddata suspeito: $($arquivo.Length) bytes" }

          & "C:\Program Files\Tesseract-OCR\tesseract.exe" --list-langs

      - name: Suite de testes (suite completa)
        run: .\.venv\Scripts\python.exe -m pytest -q

      - name: Verificador de producao (6 checks com execucao real)
        # Portao de proposito: o verificador ja imprimiu "6/6 PASSOU" saindo com codigo 1.
        # Rodar aqui impede que o exit code volte a divergir do resultado impresso.
        run: .\.venv\Scripts\python.exe tools/verificar_producao.py

      - name: Prova de idempotencia (pipeline roda 2x, zero duplicata)
        run: .\.venv\Scripts\python.exe tools/verificar.py

      - name: Comando unico da entrega (modo mock)
        run: .\.venv\Scripts\python.exe -m app.run --mock

      - name: Guardar a planilha gerada como evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planilha-controle-financeiro
          path: |
            data/out/controle_financeiro.xlsx
            data/out/controle_financeiro.csv
            data/out/resumo.json
          if-no-files-found: warn
          retention-days: 14
